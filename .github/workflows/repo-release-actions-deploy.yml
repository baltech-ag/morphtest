name: Release Actions - Deploy build
on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: uv run inv lint --no-fix

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # report every platform, not only the first failure
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # oldest and newest supported version
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: uv run --python ${{ matrix.python }} inv tests
