name: Release Actions - Deploy build
on: [push]

jobs:
  lint:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: uv run inv lint --no-fix

  test:
    runs-on: windows-2022
    strategy:
      matrix:
        # oldest and newest supported version
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: uv run --python ${{ matrix.python }} inv tests
